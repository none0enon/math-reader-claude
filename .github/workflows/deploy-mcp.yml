name: Deploy MCP server

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MCP_LOGIN_PASSWORD: ${{ secrets.MCP_LOGIN_PASSWORD }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_BUCKET_NAME MCP_LOGIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          if [ -n "$R2_BUCKET_NAME" ] && ! [[ "$R2_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::R2_BUCKET_NAME must be the bucket name only (lowercase letters, digits, hyphens)."
            missing=1
          fi
          exit $missing
        working-directory: .

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Point the R2 binding at the math-reader bucket
        run: sed -i "s/R2_BUCKET_NAME_PLACEHOLDER/${R2_BUCKET_NAME}/" wrangler.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set login password
        run: printf '%s' "$MCP_LOGIN_PASSWORD" | npx wrangler secret put MCP_LOGIN_PASSWORD
