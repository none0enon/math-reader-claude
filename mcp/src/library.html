<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Math Reader 书库</title>
<!-- MCP Apps 客户端库：版本固定，integrity 为 npm 包内同一文件的 SHA-384 -->
<link rel="modulepreload" href="https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js"
      integrity="sha384-wSTuCTWt2+bD7kgcVHbiUFIEDVUNFUZjWmT/T0NTP1RTg45gZJ4zVNOYLvujAZ/I" crossorigin="anonymous">
<style>
  /* 颜色和字号取 Claude 下发的样式变量；括号里的值只在宿主没提供变量时使用 */
  :root {
    color-scheme: light dark;
    --mr-text: var(--color-text-primary, light-dark(#141413, #faf9f5));
    --mr-text-2: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
    --mr-text-3: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
    --mr-bg-2: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
    --mr-inverse-bg: var(--color-background-inverse, light-dark(#141413, #faf9f5));
    --mr-inverse-text: var(--color-text-inverse, light-dark(#ffffff, #141413));
    --mr-border-2: var(--color-border-secondary, light-dark(rgba(31, 30, 29, 0.3), rgba(222, 220, 209, 0.3)));
    --mr-ring: var(--color-ring-primary, light-dark(rgba(20, 20, 19, 0.7), rgba(250, 249, 245, 0.7)));
    --mr-ok-bg: var(--color-background-success, light-dark(#e9f1dc, #1b4614));
    --mr-ok: var(--color-text-success, light-dark(#265b19, #7ab948));
    --mr-warn-bg: var(--color-background-warning, light-dark(#f6eedf, #483a0f));
    --mr-warn: var(--color-text-warning, light-dark(#5a4815, #d1a041));
    --mr-info-bg: var(--color-background-info, light-dark(#d6e4f6, #253e5f));
    --mr-info: var(--color-text-info, light-dark(#3266ad, #80aadd));
    --mr-danger: var(--color-text-danger, light-dark(#7f2c28, #ee8884));
    --mr-bw: var(--border-width-regular, 0.5px);
    --mr-r-sm: var(--border-radius-sm, 6px);
    --mr-r-md: var(--border-radius-md, 8px);
    --mr-r-lg: var(--border-radius-lg, 10px);
    --mr-r-full: var(--border-radius-full, 9999px);
    --mr-xs: var(--font-text-xs-size, 12px);
    --mr-sm: var(--font-text-sm-size, 14px);
    --mr-md: var(--font-text-md-size, 16px);
    --mr-strong: var(--font-weight-semibold, 600);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif);
    font-size: var(--mr-sm);
    line-height: var(--font-text-sm-line-height, 1.4);
    color: var(--mr-text);
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--mr-ring); outline-offset: 1px; }
  [hidden] { display: none !important; }

  #root { padding: 2px; }
  html.fullscreen #root { height: 100vh; height: 100dvh; padding: 0; }

  .btn {
    min-height: 36px;
    padding: 6px 14px;
    border: var(--mr-bw) solid var(--mr-border-2);
    border-radius: var(--mr-r-md);
    background: transparent;
    font-weight: var(--mr-strong);
    white-space: nowrap;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--mr-bg-2); }
  .btn.primary { border-color: transparent; background: var(--mr-inverse-bg); color: var(--mr-inverse-text); }
  .btn.primary:hover:not(:disabled) { background: var(--mr-inverse-bg); opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    padding: 0 8px;
    border: var(--mr-bw) solid var(--mr-border-2);
    border-radius: var(--mr-r-full);
    color: var(--mr-text-2);
    font-size: var(--mr-xs);
    font-weight: normal;
    line-height: 20px;
    white-space: nowrap;
  }
  .chip.ok { border-color: transparent; background: var(--mr-ok-bg); color: var(--mr-ok); }
  .chip.warn { border-color: transparent; background: var(--mr-warn-bg); color: var(--mr-warn); }
  .chip.info { border-color: transparent; background: var(--mr-info-bg); color: var(--mr-info); }

  .sk { display: block; height: 12px; border-radius: 4px; background: var(--mr-bg-2); animation: mr-pulse 1.4s ease-in-out infinite; }
  @keyframes mr-pulse { 50% { opacity: 0.45; } }

  /* ---------- 对话里的卡片 ---------- */
  #card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 16px;
    border: var(--mr-bw) solid var(--mr-border-2);
    border-radius: var(--mr-r-lg);
  }
  .card-head { display: flex; align-items: center; gap: 8px; font-size: var(--mr-md); font-weight: var(--mr-strong); }
  .card-head svg { flex: none; width: 18px; height: 18px; color: var(--mr-text-2); }
  .card-summary { color: var(--mr-text-2); }
  .card-summary.error { color: var(--mr-danger); }
  .card-note { color: var(--mr-text-3); font-size: var(--mr-xs); overflow-wrap: anywhere; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

  /* ---------- 选择器 ---------- */
  #picker { display: flex; flex-direction: column; }
  html.fullscreen #picker { height: 100%; }
  html:not(.fullscreen) #picker { border: var(--mr-bw) solid var(--mr-border-2); border-radius: var(--mr-r-lg); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
  .top { flex: none; flex-wrap: wrap; border-bottom: var(--mr-bw) solid var(--mr-border-2); }
  .top-title { font-size: var(--mr-md); font-weight: var(--mr-strong); white-space: nowrap; }
  .search {
    flex: 1 1 200px;
    min-width: 0;
    min-height: 36px;
    padding: 6px 10px;
    border: var(--mr-bw) solid var(--mr-border-2);
    border-radius: var(--mr-r-md);
    background: transparent;
  }
  .search::placeholder { color: var(--mr-text-3); }

  .panes { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(220px, 34%) 1fr; }
  .pane { min-width: 0; padding: 8px; }
  html.fullscreen .pane { overflow-y: auto; overscroll-behavior: contain; }
  .books { border-right: var(--mr-bw) solid var(--mr-border-2); }
  #picker.single .panes { grid-template-columns: 1fr; }
  #picker.single .books { border-right: 0; }
  #picker.single:not(.show-chapters) .chapters { display: none; }
  #picker.single.show-chapters .books { display: none; }
  #picker:not(.single) .back { display: none; }

  .group { padding: 10px 10px 4px; color: var(--mr-text-3); font-size: var(--mr-xs); }
  .empty { margin: 0; padding: 20px 10px; color: var(--mr-text-2); text-align: center; }
  .empty.error { color: var(--mr-danger); }

  .book, .chapter {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 0;
    border-radius: var(--mr-r-md);
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .book:hover, .chapter:hover { background: var(--mr-bg-2); }
  .book.selected, .chapter.selected { background: var(--mr-bg-2); box-shadow: inset 3px 0 0 var(--mr-text); }
  .book { display: flex; flex-direction: column; gap: 3px; }
  .book-title { font-weight: var(--mr-strong); overflow-wrap: anywhere; }
  .book-meta { color: var(--mr-text-2); font-size: var(--mr-xs); overflow-wrap: anywhere; }

  .back {
    min-height: 40px;
    margin-bottom: 4px;
    padding: 6px 10px;
    border: 0;
    border-radius: var(--mr-r-md);
    background: none;
    color: var(--mr-text-2);
    cursor: pointer;
  }
  .back:hover { background: var(--mr-bg-2); }
  .pane-head { padding: 6px 10px 10px; }
  .pane-title { font-size: var(--mr-md); font-weight: var(--mr-strong); overflow-wrap: anywhere; }

  .chapter { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 10px; align-items: start; }
  .ch-index { color: var(--mr-text-3); text-align: right; font-variant-numeric: tabular-nums; }
  .ch-main { display: flex; flex-direction: column; min-width: 0; }
  .ch-title { overflow-wrap: anywhere; }
  .chapter.selected .ch-title { font-weight: var(--mr-strong); }
  .chapter.match .ch-title { text-decoration: underline; text-decoration-color: var(--mr-info); text-underline-offset: 3px; }
  .ch-topics { color: var(--mr-text-3); font-size: var(--mr-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .ch-pages { color: var(--mr-text-2); font-size: var(--mr-xs); white-space: nowrap; }

  .range {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin-top: 8px;
    padding: 10px;
    border: var(--mr-bw) dashed var(--mr-border-2);
    border-radius: var(--mr-r-md);
    cursor: pointer;
  }
  .range.selected { border-style: solid; background: var(--mr-bg-2); box-shadow: inset 3px 0 0 var(--mr-text); }
  .range-label { font-weight: var(--mr-strong); }
  .range-inputs { display: inline-flex; align-items: center; gap: 6px; color: var(--mr-text-2); }
  .range input {
    width: 4.5em;
    min-height: 32px;
    padding: 4px 6px;
    border: var(--mr-bw) solid var(--mr-border-2);
    border-radius: var(--mr-r-sm);
    background: transparent;
    text-align: center;
  }

  .foot { flex: none; justify-content: space-between; border-top: var(--mr-bw) solid var(--mr-border-2); }
  .selection { display: flex; flex-direction: column; min-width: 0; }
  .sel-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sel-text.muted { color: var(--mr-text-3); }
  .sel-warn { color: var(--mr-warn); font-size: var(--mr-xs); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(16px + var(--mr-safe-bottom, 0px));
    max-width: calc(100% - 32px);
    padding: 6px 14px;
    border-radius: var(--mr-r-md);
    background: var(--mr-inverse-bg);
    color: var(--mr-inverse-text);
    font-size: var(--mr-xs);
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }

  @media (pointer: coarse) {
    .btn { min-height: 44px; }
    .range input { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
    #toast { transition: none; }
  }
</style>
</head>
<body>
<div id="root">
  <section id="card" aria-label="Math Reader 书库">
    <div class="card-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Math Reader 书库</span>
    </div>
    <div class="card-summary" id="cardSummary"></div>
    <div class="card-note" id="cardNote" hidden></div>
    <div class="card-actions">
      <button class="btn primary" id="openPicker" type="button" hidden>选择书和章节</button>
      <button class="btn" id="cardRetry" type="button" hidden>重试</button>
    </div>
  </section>

  <section id="picker" hidden aria-label="Math Reader 书库">
    <div class="bar top">
      <span class="top-title">Math Reader 书库</span>
      <input class="search" id="search" type="search" placeholder="搜索书名、作者、章节" aria-label="搜索书名、作者、章节" autocomplete="off">
      <button class="btn" id="refresh" type="button">刷新</button>
    </div>
    <div class="panes">
      <div class="pane books" id="books"></div>
      <div class="pane chapters" id="chapters"></div>
    </div>
    <div class="bar foot">
      <div class="selection" id="selection"></div>
      <button class="btn primary" id="write" type="button" disabled>写讲义</button>
    </div>
  </section>
</div>
<div id="toast" role="status"></div>

<script type="module">
  const SDK_URL = 'https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js';
  // 写讲义请求的模板，由服务器在下发界面时填入；{{document}} {{id}} {{part}} {{start}} {{end}} {{topicsLine}} 由界面替换
  const LECTURE_TEMPLATE = /*LECTURE_TEMPLATE*/"";
  // 窄于这个宽度时，书目和章节分两步显示
  const SINGLE_PANE_WIDTH = 640;

  const $ = (id) => document.getElementById(id);
  const els = {
    root: $('root'),
    card: $('card'),
    cardSummary: $('cardSummary'),
    cardNote: $('cardNote'),
    openPicker: $('openPicker'),
    cardRetry: $('cardRetry'),
    picker: $('picker'),
    search: $('search'),
    refresh: $('refresh'),
    books: $('books'),
    chapters: $('chapters'),
    selection: $('selection'),
    write: $('write'),
    toast: $('toast'),
  };

  const state = {
    status: 'loading', // loading | ready | error
    message: '',
    view: null, // { updatedAt, documents }
    displayMode: 'inline',
    // 宿主不支持全屏时，选择器直接显示在对话里
    inlinePicker: false,
    query: '',
    bookId: null,
    selection: null, // { kind: 'chapter', index } | { kind: 'range' }
    // 单栏布局时显示章节栏
    showChapters: false,
    // 结果里没附带大纲的书，选中时读取
    outlines: new Map(),
    outlineLoading: new Set(),
    outlineErrors: new Map(),
    ranges: new Map(),
    sending: false,
    refreshing: false,
    lastSent: '',
  };

  let sdk = null;
  let app = null;

  // ---------- 工具函数 ----------

  function h(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      // 用 CSSOM 设置样式，不写 style 属性（沙箱的 CSP 可能禁止内联样式属性）
      else if (key === 'style') Object.assign(node.style, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat()) {
      if (child === undefined || child === null || child === false) continue;
      node.append(child);
    }
    return node;
  }

  function chip(text, tone) {
    return h('span', { class: tone ? 'chip ' + tone : 'chip', text });
  }

  function skeleton(rows) {
    return h('div', { 'aria-hidden': 'true' },
      Array.from({ length: rows }, (_, i) => h('div', { style: { padding: '12px 10px' } },
        h('span', { class: 'sk', style: { width: `${70 - (i % 3) * 15}%` } }),
        h('span', { class: 'sk', style: { width: '40%', marginTop: '8px', height: '10px' } }))));
  }

  let toastTimer = null;
  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
  }

  function resultText(result) {
    return (result?.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  }

  function includes(text, query) {
    return typeof text === 'string' && text.toLowerCase().includes(query);
  }

  function chapterMatches(ch, query) {
    return includes(ch.title, query) || (ch.topics || []).some((t) => includes(t, query));
  }

  function bookById(id) {
    return state.view?.documents.find((doc) => doc.id === id) || null;
  }

  function chaptersOf(doc) {
    return doc.chapters ?? state.outlines.get(doc.id) ?? null;
  }

  function totalPagesOf(doc) {
    return doc.pages?.total || doc.totalPages || 0;
  }

  function validRange(start, end) {
    return Number.isInteger(start) && Number.isInteger(end) && start >= 1 && end >= start;
  }

  function pagesLabel(doc) {
    const pages = doc.pages;
    if (!pages) return '书页未同步';
    return pages.ready >= pages.total ? '书页已同步' : `书页 ${pages.ready}/${pages.total}`;
  }

  function docMeta(doc) {
    return [doc.author, doc.totalPages ? `${doc.totalPages} 页` : null].filter(Boolean).join(' · ');
  }

  function rangeOf(doc) {
    let range = state.ranges.get(doc.id);
    if (!range) {
      const total = totalPagesOf(doc);
      // 论文默认整篇；书默认前 20 页
      const end = total ? (doc.kind === 'paper' ? total : Math.min(total, 20)) : 1;
      range = { start: '1', end: String(end) };
      state.ranges.set(doc.id, range);
    }
    return range;
  }

  function selectionKey(selection) {
    if (!selection) return null;
    return selection.kind === 'chapter' ? 'chapter:' + selection.index : 'range';
  }

  // 当前选择对应的讲义范围；error 说明为什么还不能写
  function currentTarget() {
    const doc = bookById(state.bookId);
    const selection = state.selection;
    if (!doc || !selection) return null;
    let target;
    if (selection.kind === 'chapter') {
      const ch = (chaptersOf(doc) || []).find((c) => c.index === selection.index);
      if (!ch) return null;
      const part = `第 ${ch.index + 1} 节“${ch.title}”`;
      if (!validRange(ch.startPage, ch.endPage)) {
        return { doc, part, display: `《${doc.title}》${part}`, error: '大纲里缺少这一节的页码，可以改用按页码' };
      }
      target = {
        doc, part, start: ch.startPage, end: ch.endPage, topics: ch.topics || [],
        display: `《${doc.title}》${part} · 第 ${ch.startPage}–${ch.endPage} 页`,
      };
    } else {
      const range = rangeOf(doc);
      const start = Number(range.start);
      const end = Number(range.end);
      const total = totalPagesOf(doc);
      if (!validRange(start, end) || (total && end > total)) {
        return {
          doc, part: '指定页码范围', display: `《${doc.title}》按页码`,
          error: total ? `页码应在 1–${total} 之间，起始页不大于结束页` : '起始页不大于结束页',
        };
      }
      target = { doc, part: '指定页码范围', start, end, display: `《${doc.title}》第 ${start}–${end} 页` };
    }
    const through = doc.pages?.through ?? 0;
    if (through < target.end) {
      target.error = doc.pages ? `书页只同步到第 ${through} 页，同步完再写` : '这本书的书页还没有同步';
    }
    return target;
  }

  // ---------- 渲染 ----------

  function layout() {
    if (state.displayMode === 'fullscreen') return 'fullscreen';
    const modes = app?.getHostContext()?.availableDisplayModes;
    if (state.inlinePicker || (app && !modes?.includes('fullscreen'))) return 'inline-picker';
    return 'card';
  }

  function updatePaneLayout() {
    const single = layout() === 'inline-picker' || window.innerWidth < SINGLE_PANE_WIDTH;
    els.picker.classList.toggle('single', single);
    els.picker.classList.toggle('show-chapters', state.showChapters);
  }

  function render() {
    const mode = layout();
    document.documentElement.classList.toggle('fullscreen', mode === 'fullscreen');
    els.card.hidden = mode !== 'card';
    els.picker.hidden = mode === 'card';
    if (mode === 'card') renderCard();
    else renderPicker();
  }

  function summaryText() {
    const docs = state.view.documents;
    const books = docs.filter((doc) => doc.kind !== 'paper').length;
    const synced = docs.filter((doc) => doc.pages && doc.pages.ready >= doc.pages.total).length;
    return `${books} 本书 · ${docs.length - books} 篇论文 · 书页已同步 ${synced} 个`;
  }

  function renderCard() {
    const summary = els.cardSummary;
    summary.classList.toggle('error', state.status === 'error');
    if (state.status === 'loading') {
      summary.replaceChildren(h('span', { class: 'sk', style: { width: '60%', margin: '4px 0' } }));
    } else if (state.status === 'error') {
      summary.textContent = state.message;
    } else if (!state.view.documents.length) {
      summary.textContent = '书库里没有 PDF。在 math-reader 上传 PDF 并完成 R2 同步后会出现在这里。';
    } else {
      summary.textContent = summaryText();
    }
    els.cardNote.hidden = !state.lastSent;
    els.cardNote.textContent = state.lastSent ? '已发送写讲义请求：' + state.lastSent : '';
    els.openPicker.hidden = state.status !== 'ready' || !state.view.documents.length;
    els.cardRetry.hidden = state.status !== 'error' || !app;
    els.cardRetry.disabled = state.refreshing;
  }

  function renderPicker() {
    updatePaneLayout();
    els.refresh.disabled = state.refreshing;
    if (state.status !== 'ready') {
      els.books.replaceChildren(state.status === 'loading'
        ? skeleton(5)
        : h('p', { class: 'empty error', text: state.message }));
      els.chapters.replaceChildren();
      renderFooter();
      return;
    }
    const docs = state.view.documents;
    // 双栏时默认选中第一本，右栏不空着；单栏先列书目
    if (!state.bookId && docs.length && !els.picker.classList.contains('single')) state.bookId = docs[0].id;
    const selected = bookById(state.bookId);
    if (selected && chaptersOf(selected) === null && !state.outlineErrors.has(selected.id)) loadOutline(selected);
    els.books.replaceChildren(...bookListNodes());
    els.chapters.replaceChildren(...chapterPaneNodes());
    renderFooter();
  }

  function bookListNodes() {
    const docs = state.view.documents;
    if (!docs.length) {
      return [h('p', { class: 'empty', text: '书库里没有 PDF。在 math-reader 上传 PDF 并完成 R2 同步后会出现在这里。' })];
    }
    const query = state.query.trim().toLowerCase();
    const nodes = [];
    for (const [kind, label] of [['book', '书籍'], ['paper', '论文']]) {
      const rows = [];
      for (const doc of docs) {
        if ((doc.kind === 'paper') !== (kind === 'paper')) continue;
        let hits = 0;
        if (query) {
          const docHit = [doc.title, doc.author, doc.subject].some((t) => includes(t, query));
          hits = (chaptersOf(doc) || []).filter((ch) => chapterMatches(ch, query)).length;
          if (!docHit && !hits) continue;
        }
        rows.push(bookNode(doc, hits));
      }
      if (!rows.length) continue;
      nodes.push(h('div', { class: 'group', text: `${label} · ${rows.length}` }), ...rows);
    }
    if (!nodes.length) {
      return [h('p', { class: 'empty', text: `没有匹配“${state.query.trim()}”的书或章节` })];
    }
    return nodes;
  }

  function bookNode(doc, hits) {
    const selected = doc.id === state.bookId;
    const pages = doc.pages;
    const pagesTone = !pages ? null : (pages.ready >= pages.total ? 'ok' : 'warn');
    return h('button', {
      class: selected ? 'book selected' : 'book',
      type: 'button',
      'aria-pressed': String(selected),
      onclick: () => selectBook(doc.id),
    },
    h('span', { class: 'book-title', text: doc.title || '（无标题）' }),
    docMeta(doc) ? h('span', { class: 'book-meta', text: docMeta(doc) }) : null,
    h('span', { class: 'chips' },
      chip(doc.chapterCount ? `大纲 ${doc.chapterCount} 节` : '无大纲'),
      chip(pagesLabel(doc), pagesTone),
      doc.lectureCount ? chip(`已有讲义 ${doc.lectureCount}`, 'info') : null,
      hits ? chip(`${hits} 节匹配`, 'info') : null));
  }

  function chapterPaneNodes() {
    const doc = bookById(state.bookId);
    if (!doc) return [h('p', { class: 'empty', text: '先选一本书' })];
    const nodes = [
      h('button', {
        class: 'back',
        type: 'button',
        onclick: () => {
          state.showChapters = false;
          updatePaneLayout();
          renderFooter();
        },
      }, '← 全部书目'),
      h('div', { class: 'pane-head' },
        h('div', { class: 'pane-title', text: doc.title || '（无标题）' }),
        h('div', {
          class: 'book-meta',
          text: [doc.kind === 'paper' ? '论文' : '书籍', docMeta(doc), pagesLabel(doc)].filter(Boolean).join(' · '),
        })),
    ];
    const chapters = chaptersOf(doc);
    if (chapters === null) {
      const error = state.outlineErrors.get(doc.id);
      nodes.push(error ? h('p', { class: 'empty error', text: error }) : skeleton(4));
    } else if (!chapters.length) {
      nodes.push(h('p', {
        class: 'empty',
        text: doc.kind === 'paper' ? '没有大纲，可以按页码选范围。' : '还没有大纲（可在 math-reader 里生成），可以按页码选范围。',
      }));
    } else {
      const query = state.query.trim().toLowerCase();
      nodes.push(h('div', null, chapters.map((ch) => chapterNode(ch, query))));
    }
    nodes.push(rangeNode(doc));
    return nodes;
  }

  function chapterNode(ch, query) {
    const key = 'chapter:' + ch.index;
    const selected = selectionKey(state.selection) === key;
    const classes = ['chapter'];
    if (selected) classes.push('selected');
    if (query && chapterMatches(ch, query)) classes.push('match');
    return h('button', {
      class: classes.join(' '),
      type: 'button',
      'data-sel': key,
      'aria-pressed': String(selected),
      onclick: () => select({ kind: 'chapter', index: ch.index }),
    },
    h('span', { class: 'ch-index', text: String(ch.index + 1) }),
    h('span', { class: 'ch-main' },
      h('span', { class: 'ch-title', text: ch.title || '（无标题）' }),
      ch.topics?.length ? h('span', { class: 'ch-topics', text: ch.topics.join(' · ') }) : null),
    h('span', { class: 'ch-side' },
      h('span', {
        class: 'ch-pages',
        text: validRange(ch.startPage, ch.endPage) ? `第 ${ch.startPage}–${ch.endPage} 页` : '缺少页码',
      }),
      ch.hasLecture ? chip('已有讲义', 'info') : null));
  }

  function rangeNode(doc) {
    const range = rangeOf(doc);
    const total = totalPagesOf(doc);
    const selected = selectionKey(state.selection) === 'range';
    const input = (field, label) => h('input', {
      type: 'number',
      min: 1,
      max: total || undefined,
      step: 1,
      inputmode: 'numeric',
      value: range[field],
      'aria-label': label,
      onfocus: () => select({ kind: 'range' }),
      oninput: (event) => {
        range[field] = event.target.value;
        refreshSelection();
      },
    });
    return h('div', {
      class: selected ? 'range selected' : 'range',
      'data-sel': 'range',
      onclick: (event) => {
        if (event.target.tagName !== 'INPUT') select({ kind: 'range' });
      },
    },
    h('span', { class: 'range-label', text: '按页码' }),
    h('span', { class: 'range-inputs' }, '第', input('start', '起始页'), '–', input('end', '结束页'), '页'));
  }

  function renderFooter() {
    const target = state.status === 'ready' ? currentTarget() : null;
    const listingBooks = els.picker.classList.contains('single') && !state.showChapters;
    let text;
    if (target) text = target.display;
    else text = state.bookId && !listingBooks ? '选一节，或按页码选范围' : '先选一本书，再选一节';
    els.selection.replaceChildren(
      h('span', { class: target ? 'sel-text' : 'sel-text muted', text, title: text }),
      target?.error ? h('span', { class: 'sel-warn', text: target.error }) : null,
    );
    els.write.disabled = !app || !target || !!target.error || state.sending;
    els.write.textContent = state.sending ? '发送中…' : '写讲义';
  }

  // 只更新选中状态和底栏，不重建列表（正在输入的页码框保持焦点）
  function refreshSelection() {
    const key = selectionKey(state.selection);
    for (const node of els.chapters.querySelectorAll('[data-sel]')) {
      const on = node.dataset.sel === key;
      node.classList.toggle('selected', on);
      if (node.tagName === 'BUTTON') node.setAttribute('aria-pressed', String(on));
    }
    renderFooter();
    scheduleContextUpdate();
  }

  // ---------- 操作 ----------

  function select(selection) {
    state.selection = selection;
    refreshSelection();
  }

  function selectBook(id) {
    if (state.bookId !== id) {
      state.bookId = id;
      state.selection = null;
    }
    state.showChapters = true;
    state.outlineErrors.delete(id);
    render();
    els.chapters.scrollTop = 0;
    scheduleContextUpdate();
  }

  async function loadOutline(doc) {
    if (!app || state.outlineLoading.has(doc.id)) return;
    state.outlineLoading.add(doc.id);
    try {
      const result = await app.callServerTool({ name: 'library_outline', arguments: { document_id: doc.id } });
      if (result.isError) throw new Error(resultText(result) || '服务器返回错误');
      state.outlines.set(doc.id, Array.isArray(result.structuredContent?.chapters) ? result.structuredContent.chapters : []);
    } catch (error) {
      state.outlineErrors.set(doc.id, '读取大纲失败：' + (error?.message || error));
    } finally {
      state.outlineLoading.delete(doc.id);
      render();
    }
  }

  async function openPicker() {
    if (!app) return;
    try {
      const result = await app.requestDisplayMode({ mode: 'fullscreen' });
      state.displayMode = result?.mode || state.displayMode;
      if (state.displayMode !== 'fullscreen') state.inlinePicker = true;
    } catch (error) {
      state.inlinePicker = true;
    }
    render();
  }

  async function requestLecture() {
    const target = currentTarget();
    if (!app || !target || target.error || state.sending) return;
    const values = {
      document: target.doc.title,
      id: target.doc.id,
      part: target.part,
      start: target.start,
      end: target.end,
      topicsLine: target.topics?.length ? `涉及主题：${target.topics.join('、')}\n` : '',
    };
    // 一次替换全部占位符，书名里出现 {{...}} 也不会被再次替换
    const text = LECTURE_TEMPLATE.replace(/\{\{(\w+)\}\}/g, (match, name) =>
      Object.hasOwn(values, name) ? String(values[name]) : match);
    state.sending = true;
    renderFooter();
    try {
      const result = await app.sendMessage({ role: 'user', content: [{ type: 'text', text }] });
      if (result?.isError) throw new Error('Claude 没有接收这条消息');
      state.lastSent = target.display;
      toast('已发送写讲义请求');
      if (state.displayMode === 'fullscreen') {
        try {
          const back = await app.requestDisplayMode({ mode: 'inline' });
          state.displayMode = back?.mode || state.displayMode;
        } catch (error) {
          // 宿主拒绝切换时留在全屏
        }
      }
    } catch (error) {
      toast('发送失败：' + (error?.message || error));
    } finally {
      state.sending = false;
      render();
    }
  }

  // 选中的书和节告诉 Claude，之后在对话框里直接说“这一节……”也能对上
  let contextTimer = null;
  function scheduleContextUpdate() {
    clearTimeout(contextTimer);
    contextTimer = setTimeout(pushModelContext, 400);
  }

  function pushModelContext() {
    if (!app?.getHostCapabilities()?.updateModelContext) return;
    const doc = bookById(state.bookId);
    if (!doc) return;
    const target = currentTarget();
    const text = target?.start
      ? `用户在 Math Reader 书库界面里选中了《${doc.title}》（id: ${doc.id}）的${target.part}，对应 PDF 第 ${target.start}–${target.end} 页。`
      : `用户在 Math Reader 书库界面里选中了《${doc.title}》（id: ${doc.id}），还没有选节。`;
    app.updateModelContext({ content: [{ type: 'text', text }] }).catch(() => {});
  }

  function applyResult(result) {
    if (result?.isError) {
      state.status = 'error';
      state.message = resultText(result) || '读取书库失败。';
    } else if (Array.isArray(result?.structuredContent?.documents)) {
      state.status = 'ready';
      state.view = result.structuredContent;
      state.outlines.clear();
      state.outlineErrors.clear();
      if (state.bookId && !bookById(state.bookId)) {
        state.bookId = null;
        state.selection = null;
        state.showChapters = false;
      }
    } else {
      state.status = 'error';
      state.message = '工具结果里没有书库数据。';
    }
    render();
  }

  async function refresh() {
    if (!app || state.refreshing) return;
    state.refreshing = true;
    render();
    try {
      applyResult(await app.callServerTool({ name: 'show_library', arguments: {} }));
    } catch (error) {
      toast('刷新失败：' + (error?.message || error));
    } finally {
      state.refreshing = false;
      render();
    }
  }

  // 主题、字体、安全区；不重建列表
  function applyHostStyles() {
    const ctx = app?.getHostContext() || {};
    if (ctx.theme) sdk.applyDocumentTheme(ctx.theme);
    if (ctx.styles?.variables) sdk.applyHostStyleVariables(ctx.styles.variables);
    if (ctx.styles?.css?.fonts) sdk.applyHostFonts(ctx.styles.css.fonts);
    const inset = ctx.safeAreaInsets;
    els.root.style.padding = inset ? `${inset.top}px ${inset.right}px ${inset.bottom}px ${inset.left}px` : '';
    document.documentElement.style.setProperty('--mr-safe-bottom', (inset?.bottom || 0) + 'px');
  }

  function fail(message) {
    state.status = 'error';
    state.message = message;
    render();
  }

  els.openPicker.addEventListener('click', openPicker);
  els.cardRetry.addEventListener('click', refresh);
  els.refresh.addEventListener('click', refresh);
  els.write.addEventListener('click', requestLecture);
  els.search.addEventListener('input', () => {
    state.query = els.search.value;
    if (layout() !== 'card') renderPicker();
  });
  // 只切换单栏/双栏的样式，不重建列表：手机弹出键盘也会触发 resize，重建会让页码框失去焦点
  window.addEventListener('resize', () => {
    updatePaneLayout();
    if (els.picker.hidden) return;
    // 单栏变双栏且还没选书时，重建一次以默认选中第一本（此时没有页码框，不会丢焦点）
    if (!els.picker.classList.contains('single') && !state.bookId) renderPicker();
    else renderFooter();
  });

  async function main() {
    render();
    try {
      sdk = await import(SDK_URL);
    } catch (error) {
      fail('界面组件加载失败（需要能访问 unpkg.com）：' + (error?.message || error));
      return;
    }
    app = new sdk.App(
      { name: 'math-reader-library', version: '1.1.0' },
      { availableDisplayModes: ['inline', 'fullscreen'] },
    );
    // 处理函数在 connect 之前设置，避免错过宿主随后发来的工具结果
    app.ontoolresult = applyResult;
    app.ontoolcancelled = () => {
      if (state.status === 'loading') fail('工具调用已取消。');
    };
    app.onhostcontextchanged = (changed) => {
      applyHostStyles();
      if (changed?.displayMode && changed.displayMode !== state.displayMode) {
        state.displayMode = changed.displayMode;
        render();
      }
    };
    try {
      await app.connect();
    } catch (error) {
      fail('无法连接 Claude：' + (error?.message || error));
      return;
    }
    state.displayMode = app.getHostContext()?.displayMode || 'inline';
    applyHostStyles();
    render();
  }

  main();
</script>
</body>
</html>
